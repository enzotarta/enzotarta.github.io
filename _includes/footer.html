<footer>
  <div class="container">
    <div class="row">
      <div class="col-lg-5">
        <div class="widget">
          <h5 class="widgetheading">Contact</h5>
          <address>
            <strong>{{ site.address.name }}</strong><br>
			{{ site.address.street }}<br>
			{{ site.address.office }}<br>
			{{ site.address.city }}
          </address>
          <i class="fa fa-envelope"></i>
          {{ site.email }}
        </div>
      </div>
    </div>

    <div id="sub-footer">
      <div class="container">
        <div class="row">
          <div class="col-lg-6">
            <ul class="social-network">
              <li><a class="fa fa-linkedin" href="https://www.linkedin.com/in/enzo-tartaglione-490950a2" title="Linkedin"></a></li>
              <li><a class="fa fa-skype" href="https://join.skype.com/invite/gyX6hyaaiahL" title="Skype"></a></li>
              <li><a class="fa fa-github" href="{{ site.social.github }}" title="GitHub"></a></li>
              <li><a class="fa fa-twitter" href="https://twitter.com/TartaglioneEnzo" title="Twitter"></a></li>
              <li>
                <a href="https://scholar.google.it/citations?user=uKuvN64AAAAJ&hl=it&oi=ao" title="Google Scholar">
                  <img src="/ico/googlescholar_ico.svg" style="width:15px;height:15px;">
                </a>
              </li>
              <li>
                <a href="https://orcid.org/0000-0003-4274-8298" title="ORCid">
                  <img src="/ico/orcid_ico.png" style="width:15px;height:15px;">
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-logos">
    <div class="container">
      <div class="row text-center">
        <div class="col-12">
          <img src="/img/telecom-paris.png" alt="Télécom Paris" class="footer-logo">
          <img src="/img/hiparis.png" alt="Hi! Paris" class="footer-logo">
          <img src="/img/france2030.png" alt="France 2030" class="footer-logo">
        </div>
      </div>
    </div>
  </div>
  <p class="muted">
    &copy; {{ "now" | date: "%Y" }} {{ site.address.name }}
  </p>
</footer>
