---
layout: default
title: Enzo Tartaglione – News Archive
nav: news
---

<section id="inner-headline">
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<h2 class="pageTitle">News Archive</h2>
			</div>
		</div>
	</div>
</section>
<section id="content">
	<div class="row">
		{% assign items = site.news | sort: "date" | reverse %}
		{% for item in items %}
		<div class="col-md-12">
			{{ item.content | markdownify }}
		</div>
		{% endfor %}
</div>
</section>
